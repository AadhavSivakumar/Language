<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A free, open language course — eleven languages, with words across 24 topics, sentences, verb conjugation and spaced-repetition review." />
  <title>Kili · Learn a language</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23212a2f'/><text x='50' y='70' font-size='58' text-anchor='middle'>&#129441;</text></svg>" />
</head>
<body>
  <!-- Top status bar -->
  <header id="topbar" class="topbar" hidden>
    <button id="home-btn" class="home-btn" title="Home" aria-label="Home"><span id="brand-mark" class="mark">கிளி</span><span id="brand-word" class="wordmark">Learn Tamil</span></button>
    <div class="topbar-right">
      <div class="topbar-stats">
        <div class="stat stat-streak" title="Day streak">
          <span id="stat-streak">0</span><span class="stat-label">day streak</span>
        </div>
        <div class="stat stat-xp" title="Total XP">
          <span id="stat-xp">0</span><span class="stat-label">xp</span>
        </div>
      </div>
      <!-- Always available: back out to the language list. -->
      <button id="lang-btn" class="lang-btn" title="Choose a language">
        <span id="lang-btn-flag" class="lang-btn-flag">🌐</span><span id="lang-btn-name" class="lang-btn-name">Languages</span>
      </button>
    </div>
  </header>

  <main id="app"></main>

  <!-- Course data is loaded on demand from courses/<language>.js -->
  <script src="./languages.js"></script>
  <script src="./app.js"></script>
</body>
</html>
