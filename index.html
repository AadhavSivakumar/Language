<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Learn Tamil the fun way — a free Duolingo-style Tamil course covering the alphabet, vocabulary, grammar and sentences." />
  <title>Kili · Learn Tamil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦜</text></svg>" />
</head>
<body>
  <!-- Top status bar -->
  <header id="topbar" class="topbar" hidden>
    <button id="home-btn" class="home-btn" title="Home" aria-label="Home">🦜 <span>Tamil</span></button>
    <div class="topbar-stats">
      <div class="stat stat-streak" title="Day streak">
        <span class="stat-icon">🔥</span><span id="stat-streak">0</span>
      </div>
      <div class="stat stat-xp" title="Total XP">
        <span class="stat-icon">⚡</span><span id="stat-xp">0</span>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <!-- Templates are built in JS; this is just the mount point. -->
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
