<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A free, open Tamil course — the alphabet, 1,500 words, sentences, verb conjugation and the Tirukkuṟaḷ." />
  <title>Kili · Learn Tamil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=Noto+Serif+Tamil:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23212a2f'/><text x='50' y='72' font-size='64' font-family='Noto Serif Tamil,serif' fill='%23c9a227' text-anchor='middle'>&#2965;</text></svg>" />
</head>
<body>
  <!-- Top status bar -->
  <header id="topbar" class="topbar" hidden>
    <button id="home-btn" class="home-btn" title="Home" aria-label="Home"><span class="mark">கிளி</span><span class="wordmark">Learn Tamil</span></button>
    <div class="topbar-stats">
      <div class="stat stat-streak" title="Day streak">
        <span id="stat-streak">0</span><span class="stat-label">day streak</span>
      </div>
      <div class="stat stat-xp" title="Total XP">
        <span id="stat-xp">0</span><span class="stat-label">xp</span>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <!-- Templates are built in JS; this is just the mount point. -->
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
